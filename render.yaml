# ==============================================================================
# Render Deployment Blueprint for Sim-Cat
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: sim-cat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn your_application.wsgi"
    envVars:
      - key: PORT
        value: 10000
